name: Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks and export JSON/SARIF
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # --exit-code 0 so leaks still produce reports without failing the step
          if [ -f .gitleaks.toml ]; then
            ./gitleaks detect --source . --config .gitleaks.toml \
              --report-format json --report-path gitleaks.json \
              --exit-code 0
            ./gitleaks detect --source . --config .gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif \
              --exit-code 0
          else
            ./gitleaks detect --source . \
              --report-format json --report-path gitleaks.json \
              --exit-code 0
            ./gitleaks detect --source . \
              --report-format sarif --report-path gitleaks.sarif \
              --exit-code 0
          fi
          test -f gitleaks.json || echo '[]' > gitleaks.json
          test -f gitleaks.sarif || echo '{"version":"2.1.0","runs":[]}' > gitleaks.sarif

      - name: Upload Gitleaks artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: |
            gitleaks.json
            gitleaks.sarif
          if-no-files-found: warn

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          set -eu
          # Prefer local configs/semgrep.yaml when present; else registry packs.
          # Also pull common packs for multi-stack repos (safe if already included).
          # Use positional params (POSIX) — semgrep container default shell is sh, not bash.
          set -- --config p/security-audit --config p/secrets
          if [ -f configs/semgrep.yaml ]; then
            set -- --config configs/semgrep.yaml "$@"
          fi
          semgrep scan "$@" --json --output semgrep.json . || true
          semgrep scan "$@" --sarif --output semgrep.sarif . || true
          test -f semgrep.json || echo '{"results":[],"errors":[]}' > semgrep.json
          test -f semgrep.sarif || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: warn

      - name: Upload Semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  normalize:
    name: Normalize findings
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Gitleaks artifacts
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-results
          path: artifacts/gitleaks

      - name: Download Semgrep artifacts
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: artifacts/semgrep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize to findings.json
        shell: bash
        run: |
          set -euo pipefail
          SEMGREP=artifacts/semgrep/semgrep.json
          GITLEAKS=artifacts/gitleaks/gitleaks.json
          mkdir -p artifacts/semgrep artifacts/gitleaks
          test -f "$SEMGREP" || echo '{"results":[]}' > "$SEMGREP"
          test -f "$GITLEAKS" || echo '[]' > "$GITLEAKS"
          python scripts/normalize_findings.py \
            --semgrep "$SEMGREP" \
            --gitleaks "$GITLEAKS" \
            --out findings.json
          python -c "import json; d=json.load(open('findings.json')); print('finding_count=', d.get('finding_count'))"

      - name: Upload findings.json
        uses: actions/upload-artifact@v4
        with:
          name: findings-json
          path: findings.json

      - name: LLM triage reminder
        run: |
          echo "Next: feed findings.json + scripts/triage_prompt.md to an LLM/agent for Korean triage."
